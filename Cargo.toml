[workspace]
resolver = "2"
members = ["crates/calculator-core", "crates/calculator-render", "crates/calculator-kindle", "crates/calculator-desktop"]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
calculator-core = { path = "crates/calculator-core" }
calculator-render = { path = "crates/calculator-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

[profile.release]
lto = true
codegen-units = 1
